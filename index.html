<title>Go-Pak · Due Diligence Statement</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --paper:#f4f1ea; --card:#fff; --card-2:#faf8f4;
  --ink:#101418; --ink-2:#3b454f; --ink-3:#77828d;
  --line:#e2ddd2; --line-2:#eeeae1;
  --kraft:#8a6a3f; --kraft-soft:#f3ecdf;
  --forest:#1f6b45; --forest-soft:#e4f0e9;
  --red:#e4002b; --red-soft:#fdeaed;
}
body{font-family:"Inter","Segoe UI",sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
h1,h2,h3{font-family:"Archivo",sans-serif;letter-spacing:-.015em;}
.mono,.code{font-family:"IBM Plex Mono",Consolas,monospace;}
.page{display:none;} .page.active{display:block;}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:12px 26px;background:var(--ink);color:#fff;flex-wrap:wrap;}
.topbar .brand{display:flex;align-items:center;gap:12px;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
.topbar .brand b{font-family:"Archivo";font-size:15px;letter-spacing:.06em;}
.topbar .sep{width:1px;height:16px;background:rgba(255,255,255,.25);}
.tools{display:flex;align-items:center;gap:8px;}
.mini{display:flex;align-items:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);}
.mini input{background:transparent;border:none;outline:none;color:#fff;font-size:12.5px;padding:7px 10px;width:200px;font-family:"IBM Plex Mono",monospace;}
.mini input::placeholder{color:rgba(255,255,255,.45);}
.mini button{background:transparent;border:none;border-left:1px solid rgba(255,255,255,.16);color:#fff;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.22);color:#fff;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;}
.btn-ghost:hover{background:rgba(255,255,255,.1);}
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 70px;}

/* Trang chủ */
.home-head{padding:46px 0 8px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--kraft);}
.home-head h1{font-size:clamp(28px,4.5vw,44px);line-height:1.05;font-weight:800;margin:14px 0 12px;}
.home-head p{font-size:14.5px;color:var(--ink-2);max-width:640px;line-height:1.6;}
.file-tag{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:12px;
  background:var(--kraft-soft);border:1px solid #e4d6bd;color:var(--kraft);padding:6px 12px;font-family:"IBM Plex Mono";}

/* Hồ sơ */
.hero{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ink);
  padding:24px 26px;margin-top:8px;}
.hero h1{font-size:28px;font-weight:800;margin:10px 0 6px;}
.hero .sub{font-size:13.5px;color:var(--ink-2);}
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-top:none;background:var(--card);}
.stat-strip .st{padding:15px 20px;border-right:1px solid var(--line);}
.stat-strip .st:last-child{border-right:none;}
.stat-strip .num{font-family:"Archivo";font-size:24px;font-weight:700;line-height:1;}
.stat-strip .lbl{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-top:6px;}

.section{margin-top:32px;}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;flex-wrap:wrap;}
.sec-num{font-family:"IBM Plex Mono";font-size:11.5px;font-weight:600;color:var(--kraft);letter-spacing:.1em;}
.sec-head h2{font-size:18px;font-weight:700;}
.sec-head .note{font-size:12px;color:var(--ink-3);margin-left:auto;}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  border:1px solid var(--line);background:var(--card);}
.fields .f{padding:14px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
.fields .f .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:5px;}
.fields .f .v{font-size:13.5px;font-weight:600;line-height:1.4;word-break:break-word;}
.fields .f .v.mute{font-weight:400;color:var(--ink-3);}
.fields .f.wide{grid-column:span 2;}

.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;}
table.data thead th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:10px 13px;background:var(--card-2);border-bottom:1px solid var(--line);white-space:nowrap;}
table.data td{padding:10px 13px;border-bottom:1px solid var(--line-2);vertical-align:top;}
table.data tbody tr:last-child td{border-bottom:none;}
table.data tbody tr:hover td{background:var(--card-2);}
table.data td.num,table.data th.num{text-align:right;font-family:"IBM Plex Mono";white-space:nowrap;}
.sub{font-size:10.5px;color:var(--ink-3);margin-top:2px;line-height:1.35;}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;white-space:nowrap;}
.chip.ok{background:var(--forest-soft);color:var(--forest);}
.chip.warn{background:var(--kraft-soft);color:var(--kraft);}
.chip.none{background:#f0eee9;color:var(--ink-3);}
.lnk{color:var(--kraft);border-bottom:1px dotted var(--kraft);cursor:pointer;}
.lnk:hover{border-bottom-style:solid;}

.footer{margin-top:40px;background:var(--ink);color:#fff;padding:18px 24px;display:flex;
  justify-content:space-between;gap:16px;flex-wrap:wrap;}
.footer .t{font-family:"Archivo";font-size:13.5px;font-weight:700;}
.footer .s{font-size:11.5px;color:rgba(255,255,255,.5);margin-top:3px;}
.crumb{font-size:12px;color:var(--ink-3);margin-bottom:14px;}
.crumb a{color:var(--kraft);border-bottom:1px dotted var(--kraft);}
@media(max-width:820px){
  .stat-strip{grid-template-columns:1fr 1fr;}
  .stat-strip .st{border-bottom:1px solid var(--line);}
  .fields .f.wide{grid-column:span 1;}
  .mini input{width:120px;}
}
@media print{ .topbar,.crumb{display:none;} body{background:#fff;} }
</style>
</head>

const dash = v => (v === undefined || v === null || v === '') ? '<span class="chip none">—</span>' : esc(v);
const risk = r => !r ? '<span class="chip none">—</span>'
  : `<span class="chip ${/low/i.test(r) ? 'ok' : 'warn'}">${esc(r)}</span>`;
const prodOf = po => P.find(p => p.po === po || p.item === po);
const forests = p => p.sources.map(s => s.forest).filter(f => f.supplier);

function fields(list) {
  return `<div class="fields">${list.map(f =>
    `<div class="f${f[2] ? ' wide' : ''}"><div class="k">${esc(f[0])}</div><div class="v">${f[1]}</div></div>`).join('')}</div>`;
}

/* ── Danh sách hồ sơ ────────────────────────────────────────── */
function renderHome() {
  const invs = uniq(P.map(p => p.invoice));
  $('homeBody').innerHTML = `
  <div class="home-head">
    <div class="eyebrow">Go-Pak Paper Products Vietnam</div>
    <h1>Due Diligence Statement<br>gửi khách hàng</h1>
    <p>Tra cứu nguồn gốc nguyên liệu của từng mã hàng: nhà cung cấp giấy, nhà máy bột giấy
      và khu rừng khai thác, theo đúng hồ sơ đã gửi kèm lô hàng.</p>
    <div class="file-tag">📄 ${esc(D.source_file)}</div>
  </div>

  <div class="section">
    <div class="sec-head"><span class="sec-num">01</span><h2>Danh sách hồ sơ</h2>
      <span class="note">${P.length} mã hàng · ${invs.length} hóa đơn</span></div>
    <div class="tbl-wrap"><table class="data"><thead><tr>
      <th>PO</th><th>Item code</th><th>Production description</th><th>HS code</th>
      <th>Invoice No</th><th>Shipment date</th><th class="num">Q'ty (case)</th>
      <th class="num">NW (kg)</th><th class="num">GW (kg)</th><th>Customer</th></tr></thead>
      <tbody>${P.map(p => `<tr onclick="location.href='?po=${encodeURIComponent(p.po)}'" style="cursor:pointer">
        <td><span class="code lnk">${esc(p.po)}</span></td>
        <td class="code">${esc(p.item)}</td>
        <td style="max-width:330px">${esc(p.desc)}</td>
        <td class="code">${esc(p.hs)}</td>
        <td class="code">${esc(p.invoice)}</td>
        <td class="mono">${dmy(p.ship_date)}</td>
        <td class="num">${fmt(p.cases)}</td>
        <td class="num">${fmt(p.nw)}</td>
        <td class="num">${fmt(p.gw)}</td>
        <td>${esc(p.customer)}</td></tr>`).join('')}</tbody></table></div>
  </div>

  <div class="section">
    <div class="sec-head"><span class="sec-num">02</span><h2>Theo hóa đơn</h2></div>
    <div class="tbl-wrap"><table class="data"><thead><tr>
      <th>Invoice No</th><th>Shipment date</th><th>Customer</th><th class="num">Mã hàng</th>
      <th class="num">Q'ty (case)</th><th class="num">NW (kg)</th><th>PO</th></tr></thead>
      <tbody>${invs.map(inv => {
        const l = P.filter(p => p.invoice === inv);
        return `<tr>
          <td class="code">${esc(inv)}</td>
          <td class="mono">${dmy(l[0].ship_date)}</td>
          <td>${esc(l[0].customer)}</td>
          <td class="num">${l.length}</td>
          <td class="num">${fmt(l.reduce((s, p) => s + (num(p.cases) || 0), 0))}</td>
          <td class="num">${fmt(l.reduce((s, p) => s + (num(p.nw) || 0), 0))}</td>
          <td>${l.map(p => `<a class="code lnk" href="?po=${encodeURIComponent(p.po)}">${esc(p.po)}</a>`).join(' ')}</td>
        </tr>`;
      }).join('')}</tbody></table></div>
  </div>
  ${footer()}`;
  document.title = 'Go-Pak · Due Diligence Statement';
}

/* ── Hồ sơ một mã hàng ──────────────────────────────────────── */
function renderProduct(po) {
  const p = prodOf(po);
  if (!p) return notFound(po);
  const fs = forests(p);
  const pulps = uniq(p.sources.map(s => s.pulp.supplier).filter(Boolean));
  const owners = uniq(fs.map(f => f.supplier));
  const countries = uniq(fs.map(f => f.country).filter(Boolean));

  $('recBody').innerHTML = `
  <div class="crumb"><a href="?">Danh sách hồ sơ</a> · ${esc(p.po)}</div>

  <div class="hero">
    <div class="eyebrow">Due Diligence Statement · ${esc(p.invoice)}</div>
    <h1 class="mono">${esc(p.po)}</h1>
    <div class="sub" style="max-width:660px">${esc(p.desc)}</div>
    <div class="sub" style="margin-top:8px;color:var(--ink-3)">
      Item code <span class="code">${esc(p.item)}</span> ·
      HS code <span class="code">${esc(p.hs)}</span> ·
      ${esc(p.customer)} · ${dmy(p.ship_date)}</div>
  </div>
  <div class="stat-strip">
    <div class="st"><div class="num mono">${fmt(p.cases)}</div><div class="lbl">Q'ty (case)</div></div>
    <div class="st"><div class="num mono">${fmt(p.nw)}</div><div class="lbl">Net weight (kg)</div></div>
    <div class="st"><div class="num mono">${owners.length}</div><div class="lbl">Forest supplier</div></div>
    <div class="st"><div class="num mono">${countries.length}</div><div class="lbl">Country of origin</div></div>
  </div>

  <div class="section">
    <div class="sec-head"><span class="sec-num">01</span><h2>Paper Product</h2>
      <span class="note">Information from Go-Pak Paper</span></div>
    ${fields([
      ['PO', `<span class="code">${esc(p.po)}</span>`],
      ['Item code', `<span class="code">${esc(p.item)}</span>`],
      ['HS code', `<span class="code">${esc(p.hs)}</span>`],
      ['Invoice No', `<span class="code">${esc(p.invoice)}</span>`],
      ['Shipment date', `<span class="mono">${dmy(p.ship_date)}</span>`],
      ["Q'ty (case)", fmt(p.cases)],
      ['NW (kg)', fmt(p.nw)],
      ['Gross weight (kg)', fmt(p.gw)],
      ['Production description', esc(p.desc), 1],
      ['Customer', dash(p.customer)],
      ['Manufacture by', dash(p.maker)],
      ['Address', dash(p.maker_address), 1],
      ['Forest cert COC', dash(p.coc)],
      ['Forest cert COC code', `<span class="code">${esc(p.coc_code)}</span>`],
      ['Factory Location', dash(p.factory_country)],
      ['Country risk level', risk(p.risk)]
    ])}
  </div>

  <div class="section">
    <div class="sec-head"><span class="sec-num">02</span><h2>Paper</h2>
      <span class="note">Information from Paper Supplier</span></div>
    ${fields([
      ['Brand', dash(p.paper.brand)],
      ['Paper type', dash(p.paper.type)],
      ['Trading name', dash(p.paper.trading)],
      ['Forest cert', `<span class="code">${esc(p.paper.cert)}</span>`],
      ['Supplier Name', dash(p.paper.supplier), 1],
      ['Address', dash(p.paper.address), 1],
      ['Forest cert COC', dash(p.paper.coc)],
      ['Forest cert COC code', `<span class="code">${esc(p.paper.coc_code)}</span>`],
      ['Factory Location', dash(p.paper.location)],
      ['Country risk level', risk(p.paper.risk)],
      ['Total risk level', risk(p.paper.total_risk)]
    ])}
  </div>

  <div class="section">
    <div class="sec-head"><span class="sec-num">03</span><h2>Pulp</h2>
      <span class="note">${pulps.length} nhà máy bột giấy</span></div>
    <div class="tbl-wrap"><table class="data"><thead><tr>
      <th>Brand</th><th>Pulp type</th><th>Supplier Name</th><th>Address</th>
      <th>Forest cert COC</th><th>Factory Location</th><th>Country risk</th><th>Total risk</th></tr></thead>
      <tbody>${pulpRows(p).map(g => `<tr>
        <td>${dash(g.brand)}</td>
        <td>${dash(g.type)}</td>
        <td><b>${esc(g.supplier)}</b>${g.n > 1 ? `<div class="sub">${g.n} dòng nguồn</div>` : ''}</td>
        <td style="max-width:230px">${dash(g.claim)}</td>
        <td class="code" style="font-size:11px">${dash(g.coc)}</td>
        <td>${dash(g.location)}</td>
        <td>${risk(g.risk)}</td>
        <td>${risk(g.total_risk)}</td></tr>`).join('')}</tbody></table></div>
  </div>

  <div class="section">
    <div class="sec-head"><span class="sec-num">04</span><h2>Forest</h2>
      <span class="note">${p.sources.length} dòng nguồn · ${owners.length} forest supplier</span></div>
    <div class="tbl-wrap"><table class="data"><thead><tr>
      <th>Forest Supplier</th><th>Scientific name</th><th>Common name</th>
      <th>Country of Origin</th><th>Production place</th><th>FM Cert</th>
      <th>Forest type / Owner</th><th>Harvest period</th><th>Risk</th><th>Attachment</th></tr></thead>
      <tbody>${p.sources.map(s => { const f = s.forest; return `<tr>
        <td style="max-width:220px"><b>${dash(f.supplier)}</b>
          <div class="sub">${esc(s.pulp.supplier || '')}</div></td>
        <td>${dash(f.sci)}</td>
        <td>${dash(f.common)}</td>
        <td>${dash(f.country)}</td>
        <td style="max-width:200px">${dash(f.place)}</td>
        <td>${dash(f.fm_type)}<div class="sub code" style="max-width:190px">${esc(f.fm_no || '')}</div></td>
        <td>${dash(f.forest_type)}<div class="sub">${esc(f.owner_type || '')}</div></td>
        <td class="mono">${dmy(f.start)}<div class="sub">→ ${dmy(f.end)}</div></td>
        <td>${risk(f.total_risk || f.risk)}</td>
        <td class="mono" style="font-size:11px">${dash(f.attachment)}</td></tr>`; }).join('')}
      </tbody></table></div>
  </div>

  ${otherOfInvoice(p)}
  ${footer()}`;
  document.title = p.po + ' · ' + p.item + ' · DDS Go-Pak';
}

function pulpRows(p) {
  const m = {};
  p.sources.forEach(s => {
    const k = (s.pulp.supplier || '—') + '|' + (s.pulp.type || '');
    if (!m[k]) m[k] = { ...s.pulp, n: 0 };
    m[k].n++;
  });
  return Object.values(m);
}

function otherOfInvoice(p) {
  const l = P.filter(x => x.invoice === p.invoice && x.po !== p.po);
  if (!l.length) return '';
  return `<div class="section">
    <div class="sec-head"><span class="sec-num">05</span><h2>Cùng hóa đơn ${esc(p.invoice)}</h2></div>
    <div class="tbl-wrap"><table class="data"><thead><tr>
      <th>PO</th><th>Item code</th><th>Production description</th>
      <th class="num">Q'ty (case)</th><th class="num">NW (kg)</th></tr></thead>
      <tbody>${l.map(x => `<tr onclick="location.href='?po=${encodeURIComponent(x.po)}'" style="cursor:pointer">
        <td><span class="code lnk">${esc(x.po)}</span></td>
        <td class="code">${esc(x.item)}</td>
        <td style="max-width:360px">${esc(x.desc)}</td>
        <td class="num">${fmt(x.cases)}</td>
        <td class="num">${fmt(x.nw)}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}

function footer() {
  return `<div class="footer">
    <div><div class="t">Go-Pak Paper Products Vietnam</div>
      <div class="s">Dữ liệu theo hồ sơ ${esc(D.source_file)}</div></div>
    <div class="s" style="text-align:right">Due Diligence Statement<br>EUDR · Quy định (EU) 2023/1115</div></div>`;
}

function notFound(code) {
  $('recBody').innerHTML = `
  <div class="crumb"><a href="?">Danh sách hồ sơ</a> · Không tìm thấy</div>
  <div class="hero" style="border-left-color:var(--red)">
    <div class="eyebrow" style="color:var(--red)">Không tìm thấy</div>
    <h1 class="mono">${esc(code || '')}</h1>
    <div class="sub">Không có mã này trong hồ sơ. Thử
      ${P.slice(0, 3).map(p => `<a class="code lnk" href="?po=${p.po}">${p.po}</a>`).join(' · ')}.</div>
  </div>${footer()}`;
  document.title = 'Không tìm thấy · Go-Pak';
}

/* ── Điều hướng ─────────────────────────────────────────────── */
function goSearch(raw) {
  if (!raw) return;
  const u = raw.trim().toUpperCase();
  const p = P.find(x => x.po.toUpperCase() === u || x.item.toUpperCase() === u);
  if (p) return location.href = '?po=' + encodeURIComponent(p.po);
  const inv = P.find(x => x.invoice.toUpperCase() === u);
  if (inv) return location.href = '?po=' + encodeURIComponent(inv.po);
  location.href = '?po=' + encodeURIComponent(raw.trim());
}
$('topBtn').addEventListener('click', () => goSearch($('topSearch').value));
$('topSearch').addEventListener('keydown', e => { if (e.key === 'Enter') goSearch($('topSearch').value); });

(function () {
  const po = new URLSearchParams(location.search).get('po');
  if (po) { $('page-rec').classList.add('active'); renderProduct(po); }
  else { $('page-home').classList.add('active'); renderHome(); }
})();

</script>
</body>
</html>
