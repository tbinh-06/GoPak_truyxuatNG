#page-search .center{text-align:center;max-width:660px;padding:40px 24px;}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:18px;}
.logo{height:34px;display:block;}
.logo-plate{background:#fff;padding:12px 20px;border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.22);display:inline-block;line-height:0;}
.logo-sm{height:26px;display:block;}
.brand-text{font-size:12px;font-weight:700;letter-spacing:1.4px;color:#cfe6d4;text-transform:uppercase;}
#page-search .company{font-size:13px;font-weight:600;color:#a8dcaa;margin-bottom:16px;}
#page-search h1{font-size:clamp(28px,5vw,38px);line-height:1.2;font-weight:700;margin-bottom:12px;}
#page-search .subtitle{font-size:14.5px;color:#c2ddc8;margin-bottom:20px;}
.mode-toggle{display:inline-flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:10px;padding:4px;margin-bottom:14px;gap:4px;flex-wrap:wrap;justify-content:center;}
.mode-btn{border:none;background:transparent;color:#d5ecda;font-size:13px;font-weight:700;
  padding:8px 18px;border-radius:7px;cursor:pointer;font-family:"Inter";}
.mode-btn:hover{background:rgba(255,255,255,.1);}
.mode-btn.active{background:var(--brand);color:#fff;}
.search-wrap{display:flex;gap:10px;background:#fff;border-radius:10px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.25);}
.search-wrap input{flex:1;border:none;outline:none;padding:12px 14px;font-size:14.5px;color:var(--text);
  background:transparent;font-family:"IBM Plex Mono",monospace;}
.search-btn{background:var(--brand);color:#fff;border:none;border-radius:7px;padding:0 24px;
  font-size:14px;font-weight:700;cursor:pointer;font-family:"Poppins";}
.search-btn:hover{background:var(--brand-dark);}
.example{margin-top:16px;font-size:12.5px;color:#9dc8a6;}
.example b{color:#e3f3e6;font-family:"IBM Plex Mono";font-weight:500;cursor:pointer;border-bottom:1px dotted rgba(255,255,255,.35);}
.example b:hover{color:#a8dcaa;}
.error-msg{margin-top:14px;font-size:13px;color:#ffb3ab;display:none;}
.search-links{margin-top:30px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14);
  display:flex;gap:34px;justify-content:center;flex-wrap:wrap;font-size:12px;color:rgba(255,255,255,.5);}
.search-links b{display:block;color:#fff;font-size:15px;font-weight:700;font-family:"Poppins";margin-bottom:2px;}
.search-links a{color:#a8dcaa;border-bottom:1px dotted #a8dcaa;}
.lang-toggle{position:fixed;top:20px;right:24px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.28);color:#fff;font-size:12.5px;font-weight:700;
  padding:7px 14px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:6px;z-index:5;}
.lang-toggle:hover{background:rgba(255,255,255,.2);}
.lang-btn{background:#fff;border:1px solid var(--border);color:var(--muted);font-size:12.5px;
  font-weight:700;padding:7px 13px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.lang-btn:hover{background:var(--bg);color:var(--text);}

/* ══ THANH TRÊN ══ */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 30px;background:#fff;border-bottom:1px solid var(--border);}
.topbar-left{display:flex;align-items:center;gap:14px;}
.topbar-left .sepline{width:1px;height:22px;background:var(--border);}
.back{color:var(--muted);font-size:13.5px;cursor:pointer;}
.back:hover{color:var(--text);text-decoration:underline;}
.code-title{font-weight:700;font-size:15px;font-family:"IBM Plex Mono";}
.topbar-right{display:flex;align-items:center;gap:10px;}
.search-box{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;
  padding:6px 14px;font-size:13px;color:var(--muted);width:230px;}
.search-box input{border:none;outline:none;flex:1;font-size:13px;color:var(--text);background:transparent;font-family:"IBM Plex Mono";}
.btn{background:var(--brand);color:#fff;border:none;padding:8px 16px;border-radius:20px;
  font-size:13px;font-weight:600;cursor:pointer;}
.btn:hover{background:var(--brand-dark);}
.btn.outline{background:#fff;color:var(--text);border:1px solid var(--border);}
.btn.outline:hover{background:var(--bg);}
.wrap{max-width:1120px;margin:24px auto;padding:0 20px 60px;}

.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;
  border-radius:50%;border:40px solid rgba(255,255,255,.06);}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;position:relative;z-index:1;}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:1.2px;color:#a8dcaa;
  font-weight:700;text-transform:uppercase;margin-bottom:10px;}
.eyebrow .dash{width:18px;height:2px;background:#a8dcaa;display:inline-block;}
.hero h1{margin:0 0 14px;font-size:28px;line-height:1.25;font-weight:700;max-width:520px;}
.export-date{text-align:right;}
.export-date .lbl{font-size:11px;color:#a8dcaa;text-transform:uppercase;letter-spacing:.06em;}
.export-date .val{font-size:22px;font-weight:700;font-family:"Poppins";}
.export-date .sub{font-size:11.5px;color:#a8dcaa;}
.code-row{display:flex;align-items:center;gap:12px;margin-bottom:18px;position:relative;z-index:1;flex-wrap:wrap;}
.code-pill{background:rgba(255,255,255,.12);padding:8px 16px;border-radius:8px;font-weight:700;
  font-size:16px;letter-spacing:.5px;font-family:"IBM Plex Mono";}
.valid-pill{background:rgba(168,220,170,.22);color:#c6ecca;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:1;}
.stat{background:rgba(255,255,255,.09);border-radius:10px;padding:12px 18px;min-width:104px;}
.stat .num{font-size:20px;font-weight:700;font-family:"Poppins";}
.stat .lbl{font-size:11px;color:#c6e3cb;margin-top:2px;}
.hero-qr-wrap{position:absolute;right:32px;bottom:26px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;}
.hero-qr-box{background:#fff;padding:8px;border-radius:8px;line-height:0;}
.hero-qr-dl{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);color:#fff;
  font-size:10.5px;font-weight:700;padding:5px 12px;border-radius:16px;cursor:pointer;white-space:nowrap;}
.hero-qr-dl:hover{background:rgba(255,255,255,.28);}
@media(max-width:900px){.hero-qr-wrap{position:static;margin:20px auto 0;}}

/* ══ SECTION ══ */
.section{margin-top:28px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;flex-wrap:wrap;}
.section-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;font-family:"Poppins";}
.step{background:var(--brand);color:#fff;font-size:12px;font-weight:700;width:24px;height:24px;
  border-radius:7px;display:flex;align-items:center;justify-content:center;}
.section-sub{font-size:12px;color:var(--muted);}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.card-header h3{margin:0;font-size:14px;}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.tag.blue{background:var(--blue-bg);color:var(--blue);}
.tag.green{background:var(--green-bg);color:var(--green);}
.field{margin-bottom:12px;}
.field .lbl{font-size:10.5px;letter-spacing:.4px;color:var(--label);text-transform:uppercase;margin-bottom:3px;}
.field .val{font-size:13.5px;color:var(--text);font-weight:600;line-height:1.4;word-break:break-word;}
.field .val.light{font-weight:400;color:var(--muted);}
.field .val.miss{color:var(--red);font-weight:500;}
.divider{border-top:1px dashed var(--border);margin:14px 0;}

/* ══ HÀNG MÃ + ACCORDION ══ */
.codes-row{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;background:#fff;}
.codes-row .cell{padding:16px 20px;border-right:1px solid var(--border);}
.codes-row .cell:last-child{border-right:none;}
.codes-row .lbl{font-size:10.5px;color:var(--label);text-transform:uppercase;margin-bottom:5px;}
.codes-row .val{font-size:15px;font-weight:700;font-family:"IBM Plex Mono";}
.codes-row .sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
.accordion{margin-top:14px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;
  padding:14px 20px;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;
  font-weight:600;cursor:pointer;}
.accordion .l{display:flex;align-items:center;gap:10px;}
.accordion .l .ic{color:var(--brand);}
.accordion .note{font-weight:400;color:var(--muted);font-size:12.5px;}
.accordion .chev{transition:transform .2s;display:inline-block;}
.accordion.open{border-radius:var(--radius) var(--radius) 0 0;}
.accordion.open .chev{transform:rotate(180deg);}
.proc-panel{display:none;border:1px solid var(--border);border-top:none;
  border-radius:0 0 var(--radius) var(--radius);background:#fff;padding:20px 22px 26px;}
.proc-panel.open{display:block;}

/* ══ TIMELINE CHUỖI ══ */
.sc-title{font-size:10.5px;letter-spacing:.5px;color:var(--label);text-transform:uppercase;margin:4px 0 24px;}
.sc-timeline{display:flex;justify-content:space-between;position:relative;}
.sc-timeline::before{content:"";position:absolute;top:19px;left:8%;right:8%;height:2px;background:var(--border);z-index:0;}
.sc-step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;
  width:18%;cursor:pointer;border-radius:8px;padding:4px 2px;transition:background .15s;}
.sc-step:hover{background:var(--green-bg);}
.sc-circle{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:16px;margin-bottom:8px;box-shadow:0 0 0 4px #fff;}
.sc-name{font-size:12.5px;font-weight:700;}
.sc-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.sc-step-active .sc-circle{box-shadow:0 0 0 4px #fff,0 0 0 6px var(--brand);}
.sc-step-active .sc-name{color:var(--brand-dark);}
.proc-table-wrap{margin-top:18px;}
.step-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  border:1px solid var(--border);border-radius:var(--radius);background:#f7faf6;margin-bottom:14px;}
.step-head .sh{padding:12px 16px;border-right:1px solid var(--border);}
.step-head .sh:last-child{border-right:none;}
.step-head .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--label);margin-bottom:4px;}
.step-head .v{font-size:13px;font-weight:600;line-height:1.35;}
@media(max-width:860px){.step-head .sh{border-right:none;border-bottom:1px solid var(--border);}}

/* ══ BẢNG ══ */
.tbl-wrap{overflow-x:auto;}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;}
table.data thead th{text-align:left;font-size:10px;letter-spacing:.4px;color:var(--label);text-transform:uppercase;
  padding:10px 13px;border-bottom:1px solid var(--border);background:#f7faf6;white-space:nowrap;font-weight:600;}
table.data td{padding:11px 13px;border-bottom:1px solid var(--border);vertical-align:top;}
table.data tbody tr:last-child td{border-bottom:none;}
table.data tbody tr:hover td{background:#f7faf6;}
table.data td.num,table.data th.num{text-align:right;font-family:"IBM Plex Mono";white-space:nowrap;}
table.data.boxed{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff;}
.sub-line{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.35;}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.chip.ok{background:var(--green-bg);color:var(--brand-dark);}
.chip.warn{background:var(--amber-bg);color:var(--amber);}
.chip.none{background:#eef1ee;color:var(--muted);}
.lnk{color:var(--brand-dark);cursor:pointer;border-bottom:1px dotted var(--brand);font-weight:600;}
.lnk:hover{border-bottom-style:solid;}
.drive-btn{display:inline-flex;align-items:center;gap:6px;background:var(--green-bg);color:var(--brand-dark);
  border:1px solid #cfe3cf;font-size:12px;font-weight:700;padding:6px 13px;border-radius:20px;white-space:nowrap;}
.drive-btn:hover{background:var(--brand);color:#fff;border-color:var(--brand);}
.drive-btn.sm{font-size:11px;padding:4px 9px;}
.tbl-scroll{max-height:440px;overflow-y:auto;overflow-x:hidden;}
.tbl-scroll thead th{position:sticky;top:0;z-index:2;}
table.forest-table{table-layout:fixed;width:100%;font-size:11.5px;}
table.forest-table th,table.forest-table td{padding:8px 9px;white-space:normal;word-break:break-word;}
table.forest-table th{white-space:normal;}
table.forest-table th:nth-child(1),table.forest-table td:nth-child(1){width:8%;}
table.forest-table th:nth-child(2),table.forest-table td:nth-child(2){width:15%;}
table.forest-table th:nth-child(3),table.forest-table td:nth-child(3){width:10%;}
table.forest-table th:nth-child(4),table.forest-table td:nth-child(4){width:12%;}
table.forest-table th:nth-child(5),table.forest-table td:nth-child(5){width:13%;}
table.forest-table th:nth-child(6),table.forest-table td:nth-child(6){width:9%;}
table.forest-table th:nth-child(7),table.forest-table td:nth-child(7){width:8%;}
table.forest-table th:nth-child(8),table.forest-table td:nth-child(8){width:6%;}
table.forest-table th:nth-child(9),table.forest-table td:nth-child(9){width:7%;}
table.forest-table th:nth-child(10),table.forest-table td:nth-child(10){width:12%;}
table.forest-table .sub-line{font-size:10px;}
.tbl-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.tbl-cap{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;}
.tbl-cap .t{font-size:13.5px;font-weight:700;font-family:"Poppins";}
.tbl-cap .s{font-size:11.5px;color:var(--muted);}

/* ══ BẢN ĐỒ ══ */
.map-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff;}
.map-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap;}
.map-head h3{margin:0;font-size:13.5px;}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--brand);display:inline-block;}
.zoom-btn{background:#fff;border:1px solid var(--border);color:var(--muted);font-size:11.5px;font-weight:600;
  padding:5px 11px;border-radius:20px;cursor:pointer;font-family:"Inter";}
.zoom-btn:hover{background:var(--green-bg);color:var(--brand-dark);border-color:var(--brand);}
.leaflet-tooltip{font-size:11.5px;font-weight:600;}
.map-status{padding:9px 20px;font-size:12px;border-bottom:1px solid var(--border);}
.map-status.ref{color:var(--amber);background:var(--amber-bg);}
.map-status.exact{color:var(--brand-dark);background:var(--green-bg);}
#map{height:420px;width:100%;}
.leaflet-popup-content{font-size:12.5px;line-height:1.5;}

/* ══ TỔNG + XÁC THỰC ══ */
.totals-row{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);
  border-radius:var(--radius);background:#fff;overflow:hidden;margin-top:14px;}
.totals-row .cell{padding:16px 22px;border-right:1px solid var(--border);}
.totals-row .cell:last-child{border-right:none;}
.totals-row .lbl{font-size:10.5px;color:var(--label);text-transform:uppercase;margin-bottom:4px;}
.totals-row .val{font-size:17px;font-weight:700;font-family:"Poppins";}
.verify-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.verify-item{border:1px solid var(--border);border-radius:var(--radius);background:#fff;padding:14px 16px;
  display:flex;gap:10px;align-items:flex-start;}
.verify-item .check{width:20px;height:20px;border-radius:50%;background:var(--green-bg);color:var(--brand-dark);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.verify-item .check.partial{background:var(--amber-bg);color:var(--amber);}
.verify-item .check.fail{background:var(--red-bg);color:var(--red);}
.verify-item .t{font-size:13px;font-weight:700;margin-bottom:2px;}
.verify-item .s{font-size:11.5px;color:var(--muted);line-height:1.45;}

.footer{margin-top:26px;background:var(--navy);color:#fff;border-radius:12px;padding:16px 24px;
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
.footer .t{font-weight:700;font-size:13.5px;font-family:"Poppins";}
.footer .s{font-size:11.5px;color:#a8dcaa;}
.footer .r{text-align:right;}
.footer .r .lbl{font-size:10.5px;color:#a8dcaa;}
.footer .r .val{font-weight:700;font-size:13.5px;}

@media(max-width:860px){
  .grid-2,.codes-row,.totals-row,.verify-grid{grid-template-columns:1fr;}
  .codes-row .cell,.totals-row .cell{border-right:none;border-bottom:1px solid var(--border);}
  .hero-top{flex-direction:column;} .export-date{text-align:left;}
  .sc-timeline{flex-wrap:wrap;gap:14px;} .sc-timeline::before{display:none;} .sc-step{width:46%;}
  .search-box{width:150px;}
}
@media print{.topbar,.accordion{display:none;} body{background:#fff;}}
</style>
</head>

const DEMO_LINKS = true;
const demoUrl = id => 'https://drive.google.com/file/d/GPP-' + String(id).replace(/[^A-Za-z0-9_-]+/g, '-') + '/view';
const docLink = (po, k) => (DRIVE.docs[po] || {})[k] || (DEMO_LINKS ? demoUrl(po + '-' + k.toUpperCase()) : '');
const geoLink = name => DRIVE.geojson[name] || (DEMO_LINKS ? demoUrl(name.replace(/\.geojison$/i, '')) : '');
function driveBtn(url, label) {
  return url
    ? `<a class="drive-btn" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)} ↗</a>`
    : `<span class="chip none">${esc(T.no_link)}</span>`;
}
function attLink(name) {
  const u = geoLink(name);
  return u ? `<a class="lnk mono" href="${esc(u)}" target="_blank" rel="noopener">${esc(name)} ↗</a>` : esc(name);
}

const lnkUrl = q => LANG !== 'en' ? q : (q === '?' ? '?lang=en' : q + (q.includes('?') ? '&' : '?') + 'lang=en');
function switchLang() {
  const u = new URLSearchParams(location.search);
  if (LANG === 'en') u.delete('lang'); else u.set('lang', 'en');
  location.search = u.toString();
}


const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const numv = v => { const n = Number(String(v).replace(/,/g, '')); return isNaN(n) ? null : n; };
const fmt = v => { const n = numv(v); return n === null ? '—' : n.toLocaleString('vi-VN'); };
const dmy = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : (s || '—'); };
const uniq = a => [...new Set(a)];
const dash = v => (v === undefined || v === null || v === '') ? '<span class="chip none">—</span>' : esc(v);
const risk = r => !r ? '<span class="chip none">—</span>'
  : `<span class="chip ${/low/i.test(r) ? 'ok' : 'warn'}">${esc(r)}</span>`;
const prodOf = c => P.find(p => p.po === c || p.item === c);
const forestsOf = p => p.sources.map(s => s.forest).filter(f => f.supplier);
const invoices = () => uniq(P.map(p => p.invoice));

function forestGroups(p) {
  const m = {};
  p.sources.forEach(s => {
    const f = s.forest;
    if (!f.supplier) return;
    const g = (m[f.supplier] = m[f.supplier] || { ...f, n: 0, starts: [], ends: [], atts: [], pulps: [] });
    g.n++;
    if (f.start) g.starts.push(f.start);
    if (f.end) g.ends.push(f.end);
    if (f.attachment) g.atts.push(f.attachment);
    if (s.pulp.supplier) g.pulps.push(s.pulp.supplier);
  });
  return Object.values(m).map(g => ({ ...g, atts: uniq(g.atts), pulps: uniq(g.pulps),
    start: g.starts.sort()[0] || '', end: g.ends.sort().pop() || '' }));
}
function pulpGroups(p) {
  const m = {};
  p.sources.forEach(s => {
    const k = (s.pulp.supplier || '—') + '|' + (s.pulp.type || '');
    if (!m[k]) m[k] = { ...s.pulp, n: 0, forests: [], woods: [] };
    m[k].n++;
    if (s.forest.supplier) { m[k].forests.push(s.forest.supplier); m[k].woods.push(s.forest.item || ''); }
  });
  return Object.values(m).map(g => ({ ...g, forests: uniq(g.forests), woods: uniq(g.woods.filter(Boolean)) }));
}

function verifyGrid(p, fg) {
  const noCountry = p.sources.filter(s => s.forest.supplier && !s.forest.country).length;
  const noAtt = fg.filter(f => !f.atts.length).length;
  const hasCoord = fg.some(f => f.coord_src === 'file');
  const items = [
    { st: 'ok', t: T.v1, s: `${esc(p.item)} · HS ${esc(p.hs)}` },
    { st: 'ok', t: T.v2, s: T.v2_s(fmt(p.cases), fmt(p.nw), fmt(p.gw)) },
    { st: noCountry ? 'partial' : 'ok', t: T.v3,
      s: uniq(fg.map(f => f.country).filter(Boolean)).join(', ') + (noCountry ? T.v3_s(noCountry) : '') },
    { st: hasCoord ? 'ok' : 'partial', t: T.v4,
      s: hasCoord ? T.v4_ok : T.v4_no + (noAtt ? T.v4_no2(noAtt) : '') },
    { st: 'ok', t: T.v5, s: `${dmy(fg.map(f => f.start).filter(Boolean).sort()[0])} – ${dmy(fg.map(f => f.end).filter(Boolean).sort().pop())}` },
    { st: 'ok', t: T.v6, s: T.v6_s(fg.filter(f => f.fm_no).length, fg.length) },
    { st: 'ok', t: T.v7, s: T.v7_s },
    { st: 'partial', t: T.v8, s: `${esc(p.customer)} · ${T.v8_s}` },
    { st: 'ok', t: T.v9, s: uniq(fg.map(f => f.total_risk || f.risk).filter(Boolean)).join(' · ') }
  ];
  return `<div class="verify-grid">${items.map(i => `
    <div class="verify-item"><span class="check ${i.st === 'ok' ? '' : i.st}">${i.st === 'ok' ? '✓' : i.st === 'partial' ? '~' : '✕'}</span>
      <div><div class="t">${esc(i.t)}</div><div class="s">${i.s}</div></div></div>`).join('')}</div>`;
}

/* ── Bản đồ ── */
let map, MAP_GROUPS = {};
function drawMap() {
  const pts = MAPF.filter(f => typeof f.lat === 'number' && typeof f.lng === 'number');
  if (!pts.length || !window.L || !$('map')) return;
  if (map) { map.remove(); map = null; }
  map = L.map('map', { scrollWheelZoom: false });
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution: 'Tiles &copy; Esri', maxZoom: 16 }).addTo(map);

  const polys = L.layerGroup().addTo(map);   // ranh giới thửa — chỉ rõ khi phóng to
  const pins = L.layerGroup().addTo(map);    // điểm đánh dấu — luôn thấy ở mọi mức zoom
  const bounds = [];
  MAP_GROUPS = {};

  pts.forEach(f => {
    const popup = `<b>${esc(f.supplier)}</b><br>${esc(f.country || '')}${f.place ? ' · ' + esc(f.place) : ''}<br>
      ${esc(f.sci || '')}<br>${esc(f.fm_type || '')} ${esc(f.fm_no || '')}<br>
      ${T.map_harvest}: ${dmy(f.start)} – ${dmy(f.end)}` +
      (f.coord_src === 'country' ? `<br><i>${T.map_ref_note}</i>` : f.coord_src === 'demo' ? `<br><i>${T.demo_note}</i>` : '');
    let center = [f.lat, f.lng];
    if (f.geojson) {
      try {
        const gl = L.geoJSON(JSON.parse(f.geojson),
          { style: { color: '#3f7440', weight: 2, fillColor: '#529351', fillOpacity: .45 } }).bindPopup(popup);
        polys.addLayer(gl);
        center = gl.getBounds().getCenter();
        bounds.push(gl.getBounds());
      } catch (e) { /* sai định dạng -> chỉ dùng điểm */ }
    }
    const pin = L.circleMarker(center, { radius: 9, color: '#fff', weight: 2, fillColor: '#529351', fillOpacity: 1 })
      .bindPopup(popup).bindTooltip(f.supplier, { direction: 'top' });
    pins.addLayer(pin);
    bounds.push(L.latLngBounds([center, center]));
    const c = f.country || '—';
    (MAP_GROUPS[c] = MAP_GROUPS[c] || []).push(center);
  });

  const all = bounds.reduce((acc, b) => acc ? acc.extend(b) : L.latLngBounds(b.getSouthWest(), b.getNorthEast()), null);
  if (all) map.fitBounds(all.pad(0.35));

  // Ở mức nhìn toàn cầu thì thửa quá nhỏ -> hiện điểm; phóng to đủ gần thì trả lại ranh giới thửa
  function syncLayers() {
    const z = map.getZoom();
    if (z >= 9) { if (map.hasLayer(pins)) map.removeLayer(pins); }
    else if (!map.hasLayer(pins)) map.addLayer(pins);
  }
  map.on('zoomend', syncLayers);
  syncLayers();
  renderMapLegend();
}

function zoomCountry(c) {
  if (!map || !MAP_GROUPS[c]) return;
  map.fitBounds(L.latLngBounds(MAP_GROUPS[c]).pad(0.6), { maxZoom: 11 });
}
function zoomAll() {
  if (!map) return;
  const all = Object.values(MAP_GROUPS).flat();
  if (all.length) map.fitBounds(L.latLngBounds(all).pad(0.35));
}
function renderMapLegend() {
  const el = $('mapLegend');
  if (!el) return;
  const cs = Object.keys(MAP_GROUPS);
  el.innerHTML = `<span><span class="dot"></span> ${T.legend}</span>` +
    cs.map(c => `<button class="zoom-btn" onclick="zoomCountry('${esc(c).replace(/'/g, "\\'")}')">${esc(c)} (${MAP_GROUPS[c].length})</button>`).join('') +
    `<button class="zoom-btn" onclick="zoomAll()">${T.zoom_all}</button>`;
}

/* ── QR ── */
function recUrl(po) { return location.origin + location.pathname + '?po=' + encodeURIComponent(po); }
function makeQr(elId, text, size) {
  const el = $(elId);
  if (!el || typeof QRCode !== 'function') return;
  el.innerHTML = '';
  new QRCode(el, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
}
function downloadQr(po) {
  if (typeof QRCode !== 'function') return;
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(host);
  new QRCode(host, { text: recUrl(po), width: 320, height: 320, correctLevel: QRCode.CorrectLevel.M });
  const src = host.querySelector('canvas');
  const pad = 46, head = 76, gap = 22, foot = 52;
  const cv = document.createElement('canvas');
  cv.width = 320 + pad * 2; cv.height = head + gap + 320 + foot;
  const x = cv.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height);
  x.fillStyle = '#529351'; x.fillRect(0, 0, cv.width, head);
  x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = 'bold 17px Arial, sans-serif';
  x.fillText('GO-PAK PAPER PRODUCTS VIETNAM', cv.width / 2, 32);
  x.font = '13px Arial, sans-serif'; x.fillStyle = '#dff0df';
  x.fillText('Due Diligence Statement · EUDR', cv.width / 2, 54);
  if (src) x.drawImage(src, pad, head + gap, 320, 320);
  x.fillStyle = '#22312a'; x.font = 'bold 20px "Courier New", monospace';
  x.fillText(po, cv.width / 2, head + gap + 320 + 32);
  x.strokeStyle = '#dfe8dc'; x.strokeRect(0.5, 0.5, cv.width - 1, cv.height - 1);
  document.body.removeChild(host);
  const a = document.createElement('a');
  a.download = 'QR_' + po + '.png'; a.href = cv.toDataURL('image/png'); a.click();
}

['topBtn', 'topBtn2'].forEach((b, i) => {
  const inp = ['topSearch', 'topSearch2'][i];
  if ($(b)) $(b).addEventListener('click', () => quickGo($(inp).value));
  if ($(inp)) $(inp).addEventListener('keydown', e => { if (e.key === 'Enter') quickGo($(inp).value); });
});

function applyStatic() {
  const other = LANG === 'en' ? 'VI' : 'EN';
  ['langS', 'langR', 'langL'].forEach(id => {
    const el = $(id);
    if (!el) return;
    const t = $(id + 'Text');
    if (t) t.textContent = other;
    el.addEventListener('click', switchLang);
  });
  ['backLink', 'backLink2'].forEach(id => { if ($(id)) $(id).textContent = T.home; });
  ['topSearch', 'topSearch2'].forEach(id => { if ($(id)) $(id).placeholder = T.ph_top; });
  ['topBtn', 'topBtn2'].forEach(id => { if ($(id)) $(id).textContent = T.search; });
  if ($('printBtn')) $('printBtn').textContent = T.print;
  if ($('listTitleTop')) $('listTitleTop').textContent = T.list_title;
  if ($('brandSub')) $('brandSub').textContent = T.brand_sub;
  if ($('searchH1')) $('searchH1').innerHTML = T.s_h1;
  if ($('searchBtn')) $('searchBtn').textContent = T.search;
  if ($('errorMsg')) $('errorMsg').textContent = T.err;
  document.documentElement.lang = LANG;
  document.title = T.head;
  document.querySelectorAll('.mode-btn').forEach(b => { b.textContent = MODES[b.getAttribute('data-mode')].label; });
  ['backLink', 'backLink2'].forEach(id => { if ($(id)) $(id).href = lnkUrl('?'); });
}

(function () {
  applyStatic();
  const q = new URLSearchParams(location.search);
  if (q.get('po')) { $('page-record').classList.add('active'); return renderRecord(q.get('po')); }
  if (q.get('list')) { $('page-list').classList.add('active'); return renderList(q.get('inv')); }
  $('page-search').classList.add('active');
  document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => setMode(b.getAttribute('data-mode'))));
  $('searchForm').addEventListener('submit', e => { e.preventDefault(); submit(); });
  setMode('po');
  const fs = uniq(P.flatMap(p => forestsOf(p).map(f => f.supplier)));
  const cs = uniq(P.flatMap(p => forestsOf(p).map(f => f.country)).filter(Boolean));
  $('searchLinks').innerHTML = `
    <div><b>${P.length}</b> ${T.u_items}</div>
    <div><b>${invoices().length}</b> ${T.u_inv}</div>
    <div><b>${fs.length}</b> ${T.u_forest}</div>
    <div><b>${cs.length}</b> ${T.u_country}</div>
    <div><a href="${lnkUrl('?list=1')}">${T.view_all}</a></div>`;
})();

</script>
</body>
</html>
